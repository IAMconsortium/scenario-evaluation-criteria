Food Availability:
    justification_criterion: >-
        This criterion flags scenarios that report levels of food availability
        that are far beyond or below human dietary energy needs.


        This is a concern, because food availability below dietary energy needs
        would imply the presence of hunger and food availability far beyond
        above human needs would imply significant overconsumption and waste.
    justification_threshold: >-
        According to the {{cite:FAO-2015}}, the Minimum Dietary Energy
        Requirement is 1,840 kilo calories food intake per person per day.
        Using a ÷0.83 conversion factor deducted from UNEP's food waste index
        report {{citep:UNEP-FWIR-2021}}, we define the lower threshold for a
        high concern as food availability below 2,220 kcal per person per day.
        The upper threshold is set to 4,000 kcal per person per day, which is
        the highest ever recorded regional food availability reported by
        {{cite:FAO-2025}}.


        The lower medium concern threshold is based on recommendations provided
        by the EAT–Lancet Commission on healthy, sustainable, and just food
        systems {{citep:Rockstrom-2025}}, which recommends an average estimate
        of 2090 kcal food intake across all ages and sex. Relying on the same
        conversion factor as before, this implies a food availability of 2,520
        kcal per person per day. The upper medium concern threshold is set to
        match the FAO's Maximum Dietary Energy Requirement of 3,110 kcal food
        intake per day, resulting in a food availability of 3,750 kcal per
        person per day {{citep:FAO-2016}}. This estimation of the Maximum Dietary
        Energy Requirement followed methodology proposed by
        {{cite:Cafiero-2014}}.


        Based on these values, we assume the following global threshold across
        all years:

        • Upper threshold, high concern: 4,000 kcal/cap/day

        • Upper threshold, medium concern: 3,750 kcal/cap/day

        • Lower threshold, medium concern: 2,520 kcal/cap/day

        • Lower threshold, high concern: 2,220 kcal/cap/day
Biodiversity:
    justification_criterion: >-
        Halting biodiversity loss is considered a Sustainable Development Goal
        (SDG) by the United Nations for maritime (SDG14) and terrestrial
        (SDG15) life {{citep:UN-SDGs-2025}}. According to the 2024 Planetary
        Boundary Health Check {{citep:PBHC-2024}}, the loss of genetic
        diversity exceeded its safe levels in 2024. The {{cite:GBF-2025}}
        targets halting human-induced species extinction by 2030.
    justification_threshold: >-
        We interpret the target of halting human-induced species extinction by
        2030 as a non-negative change rate of the biodiversity intactness index.


        Therefore, the lower threshold for the biodiversity intactness index is
        set to zero.
Unsustainable Hydropower Use:
    justification_criterion: >-
        Hydropower can negatively impact nature by altering river ecosystems,
        disrupting fish migration, and affecting water quality. Dams can
        change natural water flow, leading to habitat loss for aquatic and
        terrestrial species. They can also trap sediment, which is essential
        for maintaining downstream ecosystems. {{cite:Thieme-2021}} found that
        if all planned hydropower dams would complete construction, this
        would result in the loss of 260,000 kilometers of free-flowing rivers
        globally.
    justification_threshold: >-
        {{cite:Opperman-2019}} show that a low level of hydropower expansion of
        no more than 1500 GW hydropower globally combined with strategic
        planning of the siting of new hydropower could reduce impacts on
        free-flowing rivers by 90%.
Unsustainable Bioenergy Use:
    justification_criterion: >-
        This criterion flags scenarios that assume a high usage of bioenergy.
        Specifically, we here refer to 2nd generation bioenergy crops, crop
        and forestry residues, municipal solid waste bioenergy and traditional
        biomass.


        Bioenergy can be a drop-in replacement to currently used fossil fuels.
        When grown in a sustainable fashion, their life-cycle of production
        and use is GHG neutral. Bio-based energy crops can be grown at low
        cost and with readily available technologies.


        Some decarbonisation scenarios therefore tend to assume a high use of
        bioenergy. Meanwhile, such a high use of bioenergy can result in (a)
        growth practices that are no longer GHG neutral in their life cycle
        (e.g. through deforestation to create more arable land for energy
        crops) or result in (b) a loss of natural habitats, which creates
        other sustainability concerns, for instance linked to a loss of
        biodiversity.
    justification_threshold: >-
        {{cite:Creutzig-2014}} have derived an upper limit for sustainable 
        biomass use of 100–300 EJ/yr. In the 6th Assessment Report of Working 
        Group 3 of the Intergovernmental Panel on Climate Change (IPCC), a 
        value of 100 EJ/yr is defined as the threshold for the onset of 
        medium concern and 245 EJ/yr a threshold for the onset of high concern 
        {{citep:IPCC-AR6-WG3-ANX3-2022}}. Another study by {{cite:Deprez-2024}} 
        suggests that medium sustainability risks arise at 50 EJ/yr and high
        risks at 120 EJ/yr.


        Based on these studies, we assume the following global thresholds
        across all years:

        • Upper threshold, medium concern: 100 EJ/yr

        • Upper threshold, high concern: 245 EJ/yr
Deforestation:
    justification_criterion: >-
        Managing forests sustainably is considered a Sustainable Development
        Goal (SDG) by the United Nations (SDG15) {{citep:UN-SDGs-2025}}. The
        Target 1 put forward by the {{cite:GBF-2025}} implies close to zero
        deforestation by 2030.
    justification_threshold: >-
        We interpret the target of near-zero deforestation as 0 Mha/year of
        deforestation in 2030.


        Therefore, the lower threshold for deforestation is set to zero.
Exceeding Prudent Limit For Geological Carbon Storage:
    justification_criterion: >-
        This criterion flags scenarios that rely on an amount of geological
        carbon storage that exceeds estimated storage potentials.


        This is a concern, because relying on an exceedance of physical
        storage potentials is unsustainable.
    justification_threshold: >-
        We use geological carbon storage volumes that exceed prudent technical
        and sustainability limits as upper bounds on cumulative CCS as
        quantified by {{cite:Gidden-2025}}.


        Based on this study, we assume the following global thresholds for
        cumulative geological carbon storage in the period 2020–2100:

        • Upper threshold, high concern: 1,460 Gt CO₂, which was identified as
        the median of the range by {{cite:Gidden-2025}} when combining spatial
        risk layers.

        • Upper threshold, medium concern: 1,290 Gt CO₂, which was identified
        as the lower bound of the range by {{cite:Gidden-2025}} when combining
        spatial risk layers.
